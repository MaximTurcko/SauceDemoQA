name: SauceDemo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest


    env:
      USER: ${{secrets.SD_USER}}
      PASS: ${{secrets.SD_PASSWORD}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run tests
      run: mvn clean test -Duser=$USER -Dpassword=$PASS

    - name: Get Allure history
      uses: actions/checkout@v2
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
    - name: Check allure-results
      run: |
        ls -la target/allure-results/
        echo "Allure results count: $(ls -1 target/allure-results/*.json 2>/dev/null | wc -l)"
    - name: Install Allure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y allure
    - name: Create empty Allure history
      run: |
        mkdir -p gh-pages/last-history
        echo "[]" > gh-pages/last-history/history.json
    - name: Generate Allure Report
      run: |
          allure generate target/allure-results --clean -o allure-report
    - name: Deploy report to Github Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v2
      env:
        PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_BRANCH: gh-pages
        PUBLISH_DIR: allure-history